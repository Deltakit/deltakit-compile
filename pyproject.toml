[project]
name = "deltakit-compile"
version = "0.1.0"
description = "A compiler toolkit for quantum error correction"
readme = "README.md"
authors = [{ name = "Deltakit Team", email = "deltakit@riverlane.com" }]
requires-python = ">=3.10,<3.15"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]

dependencies = [
  "xdsl>=0.66,<0.69",
  "typer>=0.15.4,<0.27",
  "pyyaml >=6.0.3, <7",
  "pydantic >=2.11.0a1, <3",
  "pydantic >=2.12, <3; python_version >= '3.14'",
  "pydantic-core >=2.28, <3",
  "numpy >=1.25, <3",
  "numpy >=1.26, <3; python_version >= '3.12'",
  "numpy >=2.1, <3; python_version >= '3.13'",
  "numpy >=2.3.4, <3; python_version >= '3.14'",
  "deltakit-stim >=0.2.2, <0.3",
  "typing_extensions >=4.15, <5",
]

[dependency-groups]
examples = [
  "ipykernel>=6.29.5,<8",
  "stim >=1.14, <2",
  "stim >=1.15, <2; python_version >= '3.13'",
  "stim >=1.16, <2; python_version >= '3.14'",
]
test = [
  "pytest >=8.4.0, <10",
  "pytest-cov >=4.0.0, <8",
  "pytest-mock >=3.14.0, <4",
  "pytest-xdist >=3.8.0, <4",
  "pytest-json-report >=1.5.0, <2",
  "filecheck >=1.0.3, <2",
  "filecheckize >=0.2, <0.3",
  "lit >=18.1.8, <19",
  "nbclient>=0.10.2,<0.12",
  "coverage >=7.7.0, <8",
  "packaging >=25.0, <27",
  { include-group = "examples" },
]
typing = ["types-PyYAML >=5.4.2, <6"]
lint = [
  { include-group = "typing" },
  # Specify lower bound for click that fixes a vulnerability caught by
  # pip-audit.
  "click>=8.3.3, <9.0",
  "mypy>=2.2.0,<3",
  "types-networkx >=3.1, <4",
  "ruff==0.15.19",
  "typos >=1.34, <2",
  "deptry>=0.23,<0.26",
  "pydoclint >=0.8.6, <0.9",
]
licences = ["pip-licenses >=3.5.3, <6"]
security = [
  "bandit[toml] >=1.7.5, <2",
  "pip-audit>=2.8.0, <3",
]
release = [
  "python-semantic-release >=10.6.1, <11",
  "packaging >=25.0, <27",
  "requests>=2.32.0",
  "tomlkit<0.16,>=0.13",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
  "pre-commit >=4.2, <5",
  "validate-pyproject >=0.24.1, <0.26.0",
]

[project.scripts]
deltakit_compile = "deltakit_compile.cli:app"

[project.urls]
Homepage = "https://github.com/Deltakit/deltakit-compile"
Source = "https://github.com/Deltakit/deltakit-compile"
Documentation = "https://deltakit.riverlane.com/"
Issues = "https://github.com/Deltakit/deltakit-compile/issues"
Changelog = "https://github.com/Deltakit/deltakit-compile/releases"

[tool.uv.build-backend]
module-name = "deltakit_compile"
module-root = "src"

[build-system]
requires = ["uv_build>=0.9.15"]
build-backend = "uv_build"

[tool.mypy]
files = ["src/**/*.py", "tests/unit/**/*.py"]
enable_error_code = ["deprecated"]

[[tool.mypy.overrides]]
module = ["stim"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["deltakit-stim"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deltakit_compile.*"]
disable_error_code = ["type-abstract"]
enable_error_code = ["explicit-override"]

[tool.typos.default]
extend-ignore-re = [
  # Ignore jupyter notebook cell IDs
  "\"id\"\\s*:\\s*\"[0-9a-f]{8,}\"",
]

[tool.typos.default.extend-words]
# Don't correct "iy" - often used in the context of "probability of an IY operation"
iy = "iy"
iz = "iz"
IZ = "IZ"
anc = "anc"
writeable = "writeable" # Used in numpy APIs.
CPY = "CPY"             # A ruff rule identifier
ser = "ser"             # Used by a pydantic function.

[tool.deptry]
known_first_party = ["deltakit_compile"]
extend_exclude = ["examples"]

[tool.deptry.per_rule_ignores]
DEP001 = ['deltakit-stim']

[tool.bandit]
exclude_dirs = ['.github', '.venv', '**/lit.cfg.py']
skips = [
  'B101', # We are happy to use asserts as part of defensive programming
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
filterwarnings = [
  "ignore:cannot collect test class 'TestOp' because it has a __init__ constructor:pytest.PytestCollectionWarning",
  "ignore:cannot collect test class 'TestTermOp' because it has a __init__ constructor:pytest.PytestCollectionWarning",
  "ignore:cannot collect test class 'TestType' because it has a __init__ constructor:pytest.PytestCollectionWarning",
]

[tool.coverage.report]
exclude_also = ["raise NotImplementedError", "return NotImplemented"]

[tool.coverage.paths]
source = [
  "src/deltakit_compile",
  ".venv/lib/python*/site-packages/deltakit_compile",
]

[tool.pydoclint]
style = 'google'
exclude = '\.git|\.venv.*'
# We do not want type hints to be duplicated in docstrings.
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# Ensure that Google style is used
check-style-mismatch = true
# Empty yields or returns do not have to be documented.
require-yield-section-when-yielding-nothing = false
require-return-section-when-returning-nothing = false
# The raise checks are oddly restrictive - forcing us to document exceptions in the function
# body and nothing more.
skip-checking-raises = true

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deltakit-compile"
version = "0.9.1"
description = "Deltakit (component deltakit-compile)"
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [{ name = "Deltakit Team", email = "deltakit@riverlane.com" }]

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dependencies = []

[dependency-groups]
test = [
  "pytest >=9.0, <10",
  "pytest-cov >=7, <8",
  "pytest-skip-slow>=0.0.5,<1.2",
  "coverage >=7.7.0, <8",
  "pytest-mock>=3.14",
  "pytest-lazy-fixtures>=1.0",
]
lint = [
  "mypy>=1.17,<3.0",
  "ruff==0.15.22",
  "typos >=1.34, <2",
  "deptry>=0.23,<0.26",
  "pydoclint>=0.9,<0.10",
]
security = ["bandit[toml] >=1.8, <2", "pip-audit >=2.7, <3"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
  "pre-commit >=4.2, <5",
  "validate-pyproject >=0.24.1,<0.26",
]
release = [
  "python-semantic-release >=10.6.1, <11",
  "packaging >=25.0, <27",
  "requests>=2.32.0",
  "tomlkit<0.16,>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["./tests/"]

[project.urls]
Homepage = "https://github.com/Deltakit/deltakit"
"Bug Tracker" = "https://github.com/Deltakit/deltakit/issues"
Changelog = "https://github.com/Deltakit/deltakit/releases"

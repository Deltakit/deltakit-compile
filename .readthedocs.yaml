# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The site is a subproject of the main Deltakit documentation, so that it is served on the same
# domain: see `docs/_ext/deltakit_nav.py`.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - pip install uv
    - uv sync --locked --group docs
    - uv run --no-sync sphinx-build -W -b html docs $READTHEDOCS_OUTPUT/html

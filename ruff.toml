# Repository-wide Ruff configuration.
#
# Should only contain project-wide configuration.
#
# Note that:
# - if a Ruff configuration file is present in any subdirectory
#   and does not contain an "extend" value pointing directly or
#   indirectly (through a chain of "extend" to this file
#   then this file is completely ignored by ruff,
# - if the "extend" value directly or indirectly points to this
#   file, values set here are used EXCEPT if redefined in a ruff
#   configuration file deeper in the folder tree. Redefinition of
#   values OVERRIDES the previously set value.

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pixi",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "_version.py",
    # Specific to dkit-compile
    "tests/filecheck/lit.cfg.py",
]

include = [
    "src/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
    "examples/**/*.ipynb",
    ".github/workflows/scripts/**/*.py",
]

# Same as Black, with extended line length.
line-length = 100
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[lint]
preview = true
explicit-preview-rules = true
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "EM",
    "EXE",
    "F",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "N",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "T",
    "UP",
    "W",
    "YTT",
    # Explicit preview rules
    "CPY001",
]
ignore = [
    # Some functions have a lot of arguments, let's ignore that for the moment.
    "PLR0913",
    # Magic constants in tests are not an urgent issue.
    # This ignore might introduce bugs if a constant changes (e.g. if "Not found"
    # becomes error 405 instead of error 404) and not all occurrences are changed
    # accordingly. That is deemed to be sufficiently improbable to still ignore this
    # error.
    "PLR2004",
    # Unused parameter warning. Ignoring for the moment, to be re-included later.
    "ARG002",
    # Exception name should be named with an Error suffix. Ignoring for the moment, to
    # be re-included later.
    "N818",
]

# Specific per-file ignores
[lint.per-file-ignores]
"tests/filecheck/**/*.py" = [
    # Printing is common and expected in workflows
    "T201",
    # Line lines are expected in filecheck tests
    "E501",
    # These are standalone scripts that aren't used as a package
    "INP001",
]
".github/workflows/scripts/**" = [
    # Printing is common and expected in workflows
    "T201",
    # Workflows don't need copyright notices
    "CPY001",
    # These are standalone scripts that aren't used as a package
    "INP001",
]
"tests/**/*.py" = [
    # Tests don't need copyright notices
    "CPY001",
]
# Invalid function name. Some functions are named with capital letters to match mathematical
# notation, especially Pauli operators. Ignore for test files which have functions named like this.
"tests/unit/passes/stabiliser/test_common.py" = ["N802"]
# Printing is common and expected in examples
"examples/**" = ["T201"]

[lint.flake8-copyright]
# Ruff configuration for enforcing copyright notices (https://docs.astral.sh/ruff/rules/missing-copyright-notice/)
# We are enforcing the style presented in https://riverlane.atlassian.net/wiki/x/VgBJhg
notice-rgx = "(?i)\\(c\\) Copyright Riverlane \\d{4}-2026. All rights reserved."
# Avoid enforcing a header on empty (<10 bytes) files
min-file-size = 10

[lint.pep8-naming]
# Allow tests names that include class names like test_MguEvCtlrReg_yaml_methods_are_unbound
extend-ignore-names = ["test_*"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"